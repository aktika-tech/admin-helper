          - /url: "#deti"
      - heading [level=3] [ref=e41]:
        - link "Кариес" [ref=e42] [cursor=pointer]:
          - /url: "#%D0%BA%D0%B0%D1%80%D0%B8%D0%B5%D1%81"
      - paragraph [ref=e43]: Я сориентирую Вас по лечению кариеса у детей в нашей клинике.
      - list [ref=e44]:
        - listitem [ref=e45]:
          - text: Стоимость лечения кариеса детям
          - strong [ref=e46]: от 9 210 до 9 850 рублей
          - text: ", зависит от степени развития кариеса."
      - heading [level=3] [ref=e47]:
        - link "Пульпит" [ref=e48] [cursor=pointer]:
          - /url: "#%D0%BF%D1%83%D0%BB%D1%8C%D0%BF%D0%B8%D1%82"
      - paragraph [ref=e49]: Я сориентирую Вас по лечению пульпита у детей в нашей клинике.
      - list [ref=e50]:
        - listitem [ref=e51]:
          - text: Стоимость лечения пульпита детям
          - strong [ref=e52]: от 12 815 до 22 050 рублей
          - text: (с эндо 4 канала с пломбой в одно посещение).
      - heading [level=3] [ref=e53]:
        - link "Периодонтит" [ref=e54] [cursor=pointer]:
          - /url: "#%D0%BF%D0%B5%D1%80%D0%B8%D0%BE%D0%B4%D0%BE%D0%BD%D1%82%D0%B8%D1%82"
      - paragraph [ref=e55]: Я сориентирую Вас по лечению периодонтита у детей в нашей клинике.
      - list [ref=e56]:
        - listitem [ref=e57]:
          - text: Стоимость лечения периодонтита детям определяется количеством каналов в зубе. Таким образом, стоимость лечения
          - strong [ref=e58]: от 14 000 рублей
          - text: (если требуется лечение 1 канала).
      - paragraph [ref=e59]: Более подробный расчет Вам сделает доктор после консультации и постановки диагноза. При необходимости отдельно оплачивается анестезия.
      - list [ref=e60]:
        - listitem [ref=e61]:
          - text: (Аппликационная анестезия —
          - strong [ref=e62]: "650"
          - text: рублей, проводниковая и инфильтрационная анестезия —
          - strong [ref=e63]: 1 250
          - text: рублей)
