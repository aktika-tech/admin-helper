        - paragraph [ref=f1e43]: Я сориентирую Вас по лечению кариеса у детей в нашей клинике.
        - list [ref=f1e44]:
          - listitem [ref=f1e45]:
            - text: Стоимость лечения кариеса детям
            - strong [ref=f1e46]: от 9 210 до 9 850 рублей
            - text: ", зависит от степени развития кариеса."
